name: Browser Session Owner Routing Regression
on:
  push:
    branches:
      - fix/browser-session-owner-routing-20261012
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run session routing regression tests
        run: node --test tests/engine-owner-routing.test.mjs
