# CI/CD Release Gate — CloudBrowser Control V1
#
# COMMIT INSTRUCTIONS:
#   This file is the EXACT content for .github/workflows/release-gate.yml
#   The Base44 builder cannot write to .github/workflows/.
#   Copy this file verbatim to .github/workflows/release-gate.yml in your repository
#   and commit it to the default branch. GitHub Actions will execute it on the
#   next push or pull_request.
#
#   cp ci/release-gate.yml .github/workflows/release-gate.yml
#   git add .github/workflows/release-gate.yml
#   git commit -m "ci: add release gate workflow"
#   git push
#
#   Until this workflow exists at .github/workflows/release-gate.yml AND produces
#   a green run, CI/CD remains PENDING and the release gate is NOT verified.

name: Release Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  code-quality:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  engine-syntax:
    name: Browser Engine Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check engine syntax
        working-directory: browser-engine
        run: node --check server.js

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for plaintext secrets in entity schemas
        run: |
          if grep -rE '^[[:space:]]*"password"[[:space:]]*:' base44/entities/ --include='*.jsonc' | grep -v 'password_encrypted' | grep -v 'has_password'; then
            echo "FAIL: Plaintext password field found in entity schema"
            grep -rE '^[[:space:]]*"password"[[:space:]]*:' base44/entities/ --include='*.jsonc' | grep -v 'password_encrypted' | grep -v 'has_password'
            exit 1
          fi
          if grep -rE '^[[:space:]]*"secret"[[:space:]]*:' base44/entities/ --include='*.jsonc' | grep -v 'secret_encrypted' | grep -v 'has_secret'; then
            echo "FAIL: Plaintext secret field found in entity schema"
            grep -rE '^[[:space:]]*"secret"[[:space:]]*:' base44/entities/ --include='*.jsonc' | grep -v 'secret_encrypted' | grep -v 'has_secret'
            exit 1
          fi
          if grep -rE '^[[:space:]]*"cookies"[[:space:]]*:' base44/entities/ --include='*.jsonc' | grep -v 'cookies_encrypted' | grep -v 'has_cookies'; then
            echo "FAIL: Plaintext cookies field found in entity schema"
            exit 1
          fi
          if grep -rE '^[[:space:]]*"storage_state"[[:space:]]*:' base44/entities/ --include='*.jsonc' | grep -v 'storage_state_encrypted' | grep -v 'has_storage_state'; then
            echo "FAIL: Plaintext storage_state field found in entity schema"
            exit 1
          fi
          echo "PASS: No plaintext credential fields in entity schemas"

      - name: Check for hardcoded API keys
        run: |
          if grep -rE '(cb_live_|cb_test_)[a-f0-9]{32}' src/ base44/ --include='*.ts' --include='*.jsx' --include='*.js'; then
            echo "FAIL: Hardcoded API key found in source"
            exit 1
          fi
          echo "PASS: No hardcoded API keys in source"

      - name: Check SSRF guards
        run: |
          grep -q "isBlockedHost" browser-engine/server.js || { echo "FAIL: SSRF guard not found in engine"; exit 1; }
          echo "PASS: SSRF guards present"

      - name: Check RLS enabled on all entities
        run: |
          MISSING=0
          for f in base44/entities/*.jsonc; do
            # User.jsonc is built-in with platform-managed security (no explicit rls key needed)
            if [ "$(basename "$f")" = "User.jsonc" ]; then
              continue
            fi
            if ! grep -q '"rls"' "$f"; then
              echo "FAIL: RLS not found in $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then exit 1; fi
          echo "PASS: RLS enabled on all entity schemas"

  release-status:
    name: Release Gate Status
    runs-on: ubuntu-latest
    needs: [code-quality, engine-syntax, security-audit]
    steps:
      - run: echo "All required gates passed — release candidate verified"
