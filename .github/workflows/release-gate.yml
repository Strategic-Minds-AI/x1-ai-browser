# CI/CD Release Gate - CloudBrowser Control V1

name: Release Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  code-quality:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: AutoComplete source contract tests
        run: node --test tests/autocomplete-source-contract.test.mjs

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  engine-syntax:
    name: Browser Engine Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check engine syntax
        working-directory: browser-engine
        run: node --check server.js

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for plaintext credential property keys in entity schemas
        shell: bash
        run: |
          set -euo pipefail
          # Only an actual JSONC property key is prohibited. Enum values or descriptive
          # text such as connection_mode="secret" must not create a false positive.
          # Encrypted and boolean-presence fields remain allowed because their keys are
          # password_encrypted/has_password, secret_encrypted/has_secret, etc.
          if grep -rnE '^[[:space:]]*"(password|secret|cookies|storage_state)"[[:space:]]*:' base44/entities/ --include='*.jsonc'; then
            echo "FAIL: Plaintext credential property key found in entity schema"
            exit 1
          fi
          echo "PASS: No plaintext password/secret/cookies/storage_state property keys in entity schemas"

      - name: Check for hardcoded API keys
        run: |
          if grep -rE '(cb_live_|cb_test_)[a-f0-9]{32}' src/ base44/ --include='*.ts' --include='*.jsx' --include='*.js'; then
            echo "FAIL: Hardcoded API key found in source"
            exit 1
          fi
          echo "PASS: No hardcoded API keys in source"

      - name: Check SSRF guards
        run: |
          grep -q "isBlockedHost" browser-engine/server.js || { echo "FAIL: SSRF guard not found in engine"; exit 1; }
          echo "PASS: SSRF guards present"

      - name: Check RLS enabled on all entities
        run: |
          MISSING=0
          for f in base44/entities/*.jsonc; do
            # User.jsonc is built-in with platform-managed security (no explicit rls key needed)
            if [ "$(basename "$f")" = "User.jsonc" ]; then
              continue
            fi
            if ! grep -q '"rls"' "$f"; then
              echo "FAIL: RLS not found in $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then exit 1; fi
          echo "PASS: RLS enabled on all entity schemas"

  release-status:
    name: Release Gate Status
    runs-on: ubuntu-latest
    needs: [code-quality, engine-syntax, security-audit]
    steps:
      - run: echo "All required gates passed - release candidate verified"
